<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Evently</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b16;
      color: white;
      min-height: 100vh;
      padding: 30px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .badge {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #151525;
      padding: 25px;
      border-radius: 18px;
      border: 1px solid #25253b;
    }

    .stat-card span {
      color: #999;
      font-size: 14px;
    }

    .stat-card h2 {
      margin-top: 10px;
      font-size: 30px;
    }

    .table-card {
      background: #151525;
      border-radius: 18px;
      overflow-x: auto;
      border: 1px solid #25253b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th,
    td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #29293e;
    }

    th {
      color: #b9a7ff;
      font-size: 14px;
    }

    td {
      color: #ddd;
    }

    .message {
      text-align: center;
      padding: 30px;
      color: #999;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">EVENTLY ✦</div>
      <div class="badge">ADMIN</div>
    </div>

    <h1>Registration Dashboard</h1>

    <p class="subtitle">
      View all event registrations in one place.
    </p>

    <div class="stats">

      <div class="stat-card">
        <span>Total Registrations</span>
        <h2 id="totalRegistrations">0</h2>
      </div>

      <div class="stat-card">
        <span>Different Events</span>
        <h2 id="totalEvents">0</h2>
      </div>

      <div class="stat-card">
        <span>Status</span>
        <h2>Active</h2>
      </div>

    </div>

    <div class="table-card">

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>College</th>
            <th>Event</th>
          </tr>
        </thead>

        <tbody id="registrationTable">
          <tr>
            <td colspan="5" class="message">
              Loading registrations...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>


  <script>

    async function loadRegistrations() {

      try {

        const response = await fetch(
          "/api/admin/registrations"
        );

        const result = await response.json();

        if (!result.success) {
          throw new Error("Failed to load registrations");
        }

        displayRegistrations(result.registrations);

      } catch (error) {

        console.log(error);

        document.getElementById("registrationTable").innerHTML = `
          <tr>
            <td colspan="5" class="message">
              ❌ Unable to load registrations
            </td>
          </tr>
        `;

      }

    }


    function displayRegistrations(registrations) {

      const table =
        document.getElementById("registrationTable");

      table.innerHTML = "";

      document.getElementById("totalRegistrations")
        .textContent = registrations.length;

      const events = new Set(
        registrations
          .map(item => item.event)
          .filter(event => event)
      );

      document.getElementById("totalEvents")
        .textContent = events.size;


      if (registrations.length === 0) {

        table.innerHTML = `
          <tr>
            <td colspan="5" class="message">
              No registrations yet.
            </td>
          </tr>
        `;

        return;
      }


      registrations.forEach(item => {

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${item.name || "-"}</td>
          <td>${item.email || "-"}</td>
          <td>${item.phone || "-"}</td>
          <td>${item.college || "-"}</td>
          <td>${item.event || "-"}</td>
        `;

        table.appendChild(row);

      });

    }


    loadRegistrations();

  </script>

</body>
</html>
