<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b16;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-box {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 60px 30px;
            border-radius: 25px;
            background: linear-gradient(135deg, #1c1c3a, #25256b);
            border: 1px solid #5555aa;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        p {
            color: #d5d5e8;
            font-size: 18px;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 14px 28px;
            background: white;
            color: #15152b;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
        }

        a:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="success-box">
        <div class="icon">🎉</div>

        <h1>Registration Successful!</h1>

        <p>
            You have successfully registered for the event.
            We look forward to seeing you there!
        </p>

        <a href="events.html">← Explore More Events</a>
    </div>

</body>
</html>
